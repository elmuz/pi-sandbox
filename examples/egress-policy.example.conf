# pi-sandbox egress policy.
#
# The sandbox has no direct route to the internet or the LAN. All HTTP(S)
# traffic goes through the shared egress proxy. The default is to deny every
# destination, including public ones. Add narrow allow rules for exactly what
# the agent needs.
#
#   default deny                      # default when omitted
#   default allow                     # legacy public-by-default (not recommended)
#   allow <hostname|IP|CIDR> [port]   # permit a destination
#   deny  <hostname|IP|CIDR> [port]   # block a destination
#
# Hostname entries also match subdomains. A rule without a port matches every
# port. For IPv6 use [2001:db8::1]:443 or put the port in a separate field.
# Explicit deny wins over explicit allow. Non-public addresses are always
# blocked unless explicitly allowed. The policy file is host-owned and
# read-only inside the proxy container.
#
# Pi needs to reach its model provider. Add only the endpoint you use:
#   allow openrouter.ai 443
#   allow api.openai.com 443
#   allow api.anthropic.com 443
#
# Package managers and git hosts also need explicit rules, for example:
#   allow registry.npmjs.org 443
#   allow pypi.org 443
#   allow files.pythonhosted.org 443
#   allow github.com 443
#   allow codeload.github.com 443
#
# To keep a self-hosted LAN resource reachable, add a narrow allow entry. It
# overrides the default private-range block:
#   allow 192.168.1.50
#   allow docs.internal
#   allow 192.168.1.0/24 443
#
# If you use `default allow` for a personal threat model, add deny rules for
# targets the sandbox must not reach directly:
#   deny mcp.example.com
#   deny 203.0.113.10

default deny
