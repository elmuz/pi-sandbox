# Optional long-running MCP services.
#
# The authoritative deployment is the server-mcp Quadlet stack
# (mcp-remote.container and mcp-disk.container). This Compose file is an
# alternative scaffold for one remote target: catafalco.
#
# Network contract:
#   - the only shared network is the internal pi-control bridge;
#   - the MCP joins its own mcp-egress network in the server-mcp deployment,
#     never the Pi sandbox's internet network;
#   - no host port is published. Clients use the DNS name on pi-control.
#
# Quadlet mapping:
#   ~/.config/server-mcp/remote.yaml        -> /etc/server-mcp/config.yaml
#   ~/.config/server-mcp/.env               -> /etc/server-mcp/.env
#   ~/.config/server-mcp/ssh/id_ed25519     -> /run/secrets/ssh_key
#   ~/.config/server-mcp/known_hosts        -> /etc/server-mcp/known_hosts
#   ~/.config/server-mcp/secrets/http-token -> /run/secrets/mcp_token
#   ~/.local/state/server-mcp/audit         -> /var/lib/server-mcp
#
# This Compose scaffold mounts the pi-sandbox state copies at the same container
# paths, so the same image and configuration layout can be used. Set
# PI_SANDBOX_STATE before running podman compose.
#
# The image is not built here; it belongs to the server-mcp repository:
#   podman build -f container/Dockerfile -t localhost/server-mcp:dev .

name: pi-sandbox

x-mcp-common: &mcp-common
  image: ${MCP_IMAGE:-localhost/server-mcp:dev}
  userns_mode: keep-id
  user: "1000:1000"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev
  restart: unless-stopped
  networks:
    - pi-control
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  mcp-remote:
    <<: *mcp-common
    container_name: mcp-remote
    environment:
      REMOTE_SERVER_MCP_CONFIG: /etc/server-mcp/config.yaml
    volumes:
      - ${PI_SANDBOX_STATE:?set PI_SANDBOX_STATE}/mcp/catafalco/config.yaml:/etc/server-mcp/config.yaml:ro
      - ${PI_SANDBOX_STATE:?set PI_SANDBOX_STATE}/mcp/catafalco/.env:/etc/server-mcp/.env:ro
      - ${PI_SANDBOX_STATE:?set PI_SANDBOX_STATE}/mcp/catafalco/ssh/id_ed25519:/run/secrets/ssh_key:ro
      - ${PI_SANDBOX_STATE:?set PI_SANDBOX_STATE}/mcp/catafalco/known_hosts:/etc/server-mcp/known_hosts:ro
      - ${PI_SANDBOX_STATE:?set PI_SANDBOX_STATE}/mcp/catafalco/audit:/var/lib/server-mcp:rw
    command:
      - remote-server-mcp
      - --config
      - /etc/server-mcp/config.yaml
      - --transport
      - streamable-http
      - --http-host
      - 0.0.0.0
      - --http-port
      - "8000"

networks:
  pi-control:
    name: ${PI_SANDBOX_MCP_NETWORK:-pi-control}
    internal: true
