---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # One entrypoint for CI and local development, with pinned versions, so
      # a clean `scripts/lint.sh --with-tests` run predicts this job.
      - name: Run linters and self-tests
        run: scripts/lint.sh --with-tests

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: image
          file: image/pi.Dockerfile
          push: false
          load: true
          tags: localhost/pi-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: docker run --rm localhost/pi-sandbox:ci pi --version

  proxy:
    name: Build egress proxy
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build proxy image
        run: |
          docker build \
            -f image/egress-proxy.Dockerfile \
            -t localhost/pi-sandbox-egress:ci \
            image

      - name: Smoke-test proxy policy
        run: |
          docker run --rm \
            --mount "type=bind,src=$PWD/examples/egress-policy.example.conf,dst=/etc/pi-egress/policy.conf,ro" \
            localhost/pi-sandbox-egress:ci \
            --check-policy \
            --policy /etc/pi-egress/policy.conf
