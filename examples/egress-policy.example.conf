# pi-sandbox egress policy.
#
# The sandbox has no direct route to the internet or the LAN. All HTTP(S)
# traffic goes through the shared egress proxy, which permits public
# destinations by default and always blocks non-public addresses.
#
# Use this file to refine the policy:
#
#   deny  <hostname|IP|CIDR> [port]   # block a destination
#   allow <hostname|IP|CIDR> [port]   # permit a private/local destination
#
# Hostname entries also match subdomains. A rule without a port matches every
# port. For IPv6 use [2001:db8::1]:443 or put the port in a separate field.
# Explicit deny rules win over explicit allow rules. The policy file is
# host-owned and read-only inside the proxy container.
#
# The MCP target must never be reachable directly from the sandbox. If the
# target is on the LAN or link-local ranges it is already blocked. If it is
# public, add its hostname or IP here, for example:
#
#   deny catafalco.example.com
#   deny 203.0.113.10
#
# To keep a self-hosted LAN resource reachable (for example local docs), add a
# narrow allow entry. It overrides the default private-range block:
#
#   allow 192.168.178.50
#   allow docs.internal
#   allow 192.168.178.0/24 443
