---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: warning

      - name: Run MCP contract self-test
        run: scripts/mcp-selftest.sh

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: image/pi.Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: compose examples .github .yamllint.yml
          config_file: .yamllint.yml

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          globs: |
            **/*.md
            **/*.markdown

      - name: Lint workflows
        uses: raven-actions/actionlint@v2.2.0

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: image
          file: image/pi.Dockerfile
          push: false
          load: true
          tags: localhost/pi-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: docker run --rm localhost/pi-sandbox:ci pi --version
